openapi: 3.1.1
info:
  title: GearBy API
  version: 1.0.0
  description: Executable API contract derived from the GearBy Source of Truth. P0 is the first MVP and recommendation endpoints describe the planned P1 boundary.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Foundation readiness probe
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '503': { $ref: '#/components/responses/ApiError' }
  /categories:
    get:
      operationId: listCategories
      summary: List fixed published activity categories
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '500': { $ref: '#/components/responses/ApiError' }
  /stores:
    get:
      operationId: listStores
      summary: List published stores using shared map and list filters
      parameters:
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/ApplyCorrection'
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/Near'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
  /stores/{storeId}:
    get:
      operationId: getStore
      summary: Get one published store
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '404': { $ref: '#/components/responses/ApiError' }
  /feedback:
    post:
      operationId: submitFeedback
      summary: Submit anonymous correction, feedback, or new-store candidate
      description: Authentication is not required. A reply email is accepted only with contact consent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackInput' }
      responses:
        '202':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '429': { $ref: '#/components/responses/ApiError' }
  /recommendation-sessions:
    post:
      operationId: createRecommendationSession
      summary: Create a draft gear-group recommendation session
      responses:
        '201':
          $ref: '#/components/responses/CreateRecommendationSessionSuccess'
        '400': { $ref: '#/components/responses/ApiError' }
  /recommendation-sessions/{sessionId}/profile:
    put:
      operationId: updateRecommendationSessionProfile
      summary: Update a recommendation session profile
      parameters: [{ $ref: '#/components/parameters/RecommendationSessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationProfile' }
      responses:
        '200':
          $ref: '#/components/responses/UpdateRecommendationSessionProfileSuccess'
        '400': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /recommendation-sessions/{sessionId}/guidance:
    get:
      operationId: getRecommendationSessionGuidance
      summary: Get gear-group guidance for a recommendation session
      parameters: [{ $ref: '#/components/parameters/RecommendationSessionId' }]
      responses:
        '200':
          $ref: '#/components/responses/GetRecommendationSessionGuidanceSuccess'
        '400': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /recommendation-sessions/{sessionId}/store-matches:
    get:
      operationId: getRecommendationSessionStoreMatches
      summary: Get verified store matches for a recommendation session
      parameters: [{ $ref: '#/components/parameters/RecommendationSessionId' }]
      responses:
        '200':
          $ref: '#/components/responses/GetRecommendationSessionStoreMatchesSuccess'
        '400': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /recommendation-sessions/{sessionId}/feedback:
    post:
      operationId: submitRecommendationSessionFeedback
      summary: Submit feedback for a recommendation session
      parameters: [{ $ref: '#/components/parameters/RecommendationSessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationFeedback' }
      responses:
        '202':
          $ref: '#/components/responses/SubmitRecommendationSessionFeedbackSuccess'
        '400': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /admin/auth/session:
    get:
      operationId: getAdminSession
      summary: Get the current administrator session and CSRF token
      responses:
        '200': { $ref: '#/components/responses/GetAdminSessionSuccess' }
  /admin/auth/login:
    post:
      operationId: loginAdminSession
      summary: Start the single administrator browser session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginInput' }
      responses:
        '200': { $ref: '#/components/responses/GetAdminSessionSuccess' }
        '401': { $ref: '#/components/responses/ApiError' }
  /admin/auth/logout:
    post:
      operationId: logoutAdminSession
      summary: End the current administrator browser session
      security: [{ adminSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200': { $ref: '#/components/responses/ApiResponse' }
        '403': { $ref: '#/components/responses/ApiError' }
  /admin/stores:
    get:
      operationId: listAdminStores
      summary: List stores across review states
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createAdminStore
      summary: Create a draft store for review
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreInput' }
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /admin/stores/{storeId}:
    patch:
      operationId: updateAdminStore
      summary: Update a draft or review store
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreInput' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /admin/stores/{storeId}/publish:
    post:
      operationId: publishAdminStore
      summary: Publish a reviewed store or re-verify a published store
      description: Repeating this operation for a published store records a new administrator verification time.
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /admin/stores/{storeId}/review:
    post:
      operationId: reviewAdminStore
      summary: Submit a draft or rejected store for review
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /admin/stores/{storeId}/reject:
    post:
      operationId: rejectAdminStore
      summary: Reject a reviewed store back to an editable state
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/StoreRejectionInput' } } }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /admin/correction-rules:
    get:
      operationId: listCorrectionRules
      summary: List explicit correction rules
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createCorrectionRule
      summary: Create an explicit correction rule
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionRuleInput' }
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /admin/correction-rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateCorrectionRule
      summary: Update an explicit correction rule
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionRuleInput' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteCorrectionRule
      summary: Delete an explicit correction rule
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /admin/feedback:
    get:
      operationId: listAdminFeedback
      summary: List feedback review queue
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /admin/feedback/{feedbackId}:
    patch:
      operationId: resolveAdminFeedback
      summary: Resolve or reject feedback and record its notification state
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters:
        - name: feedbackId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackResolutionInput' }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /admin/category-health:
    get:
      operationId: getCategoryHealth
      summary: List category counts and open review flags
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /admin/category-review-flags:
    get:
      operationId: listCategoryReviewFlags
      summary: List category review flags
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createCategoryReviewFlag
      summary: Create a manual category review flag
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ManualCategoryReviewFlagInput' } } }
      responses:
        '201':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /admin/category-review-flags/{flagId}:
    patch:
      operationId: updateCategoryReviewFlag
      summary: Assign or resolve a category review flag
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters:
        - name: flagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryReviewFlagUpdateInput' } } }
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: Get operational counts and category-health flags
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      responses:
        '200':
          $ref: '#/components/responses/ApiResponse'
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /admin/candidate-ingestion/runs:
    get:
      operationId: listCandidateIngestionRuns
      summary: List durable candidate ingestion runs
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CandidateIngestionRunStatus' } }
        - { name: provider, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ListCandidateIngestionRunsSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /admin/candidate-ingestion/runs/{runId}:
    get:
      operationId: getCandidateIngestionRun
      summary: Get one candidate ingestion run summary
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/GetCandidateIngestionRunSuccess' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /admin/candidate-ingestion/items:
    get:
      operationId: listCandidateIngestionItems
      summary: List candidate ingestion review items
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: runId, in: query, schema: { type: string, format: uuid } }
        - { name: latestOutcome, in: query, schema: { $ref: '#/components/schemas/CandidateItemOutcome' } }
        - { name: latestMatchStatus, in: query, schema: { $ref: '#/components/schemas/CandidateMatchStatus' } }
      responses:
        '200': { $ref: '#/components/responses/ListCandidateIngestionItemsSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /admin/candidate-ingestion/items/{itemId}/resolve:
    post:
      operationId: resolveCandidateIngestionItem
      summary: Resolve an ambiguous or quarantined candidate item
      description: LINK_EXISTING links an existing store without mutating it. CREATE_DRAFT creates a DRAFT store only. This operation never publishes stores.
      security: [{ adminSession: [] }, { adminOidc: [ADMIN] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateResolutionInput' }
      responses:
        '200': { $ref: '#/components/responses/ResolveCandidateIngestionItemSuccess' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Single administrator browser session. Unsafe requests also require the X-XSRF-TOKEN header returned by `/admin/auth/session`.
    adminOidc:
      type: oauth2
      description: Invite-only administrator authentication; public administrator signup is not provided.
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.com/authorize
          tokenUrl: https://identity.example.com/token
          scopes: { ADMIN: GearBy administrator access }
  parameters:
    StoreId: { name: storeId, in: path, required: true, schema: { type: string, format: uuid } }
    RecommendationSessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    Category:
      name: category
      in: query
      description: Repeat the parameter to select multiple categories. Stores matching at least one selected category are returned.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items: { $ref: '#/components/schemas/CategorySlug' }
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    Query: { name: q, in: query, schema: { type: string, maxLength: 120 } }
    ApplyCorrection:
      name: applyCorrection
      in: query
      description: Set to false when the user chooses to view results for the original query.
      schema: { type: boolean, default: true }
    Bbox: { name: bbox, in: query, schema: { type: string, example: '126.7,37.4,127.2,37.7' } }
    Near: { name: near, in: query, schema: { type: string, example: '37.5665,126.9780' } }
    Sort: { name: sort, in: query, schema: { type: string, enum: [name, distance], default: name } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    ApiResponse:
      description: Successful response envelope. The operation-specific value is in `data`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    ApiError:
      description: Failed response envelope. The HTTP status and `error.code` describe the failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    GetAdminSessionSuccess:
      description: Administrator session response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GetAdminSessionSuccessEnvelope' }
    ListCandidateIngestionRunsSuccess:
      description: Candidate ingestion run page response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ListCandidateIngestionRunsSuccessEnvelope' }
    GetCandidateIngestionRunSuccess:
      description: Candidate ingestion run response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GetCandidateIngestionRunSuccessEnvelope' }
    ListCandidateIngestionItemsSuccess:
      description: Candidate ingestion item page response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ListCandidateIngestionItemsSuccessEnvelope' }
    ResolveCandidateIngestionItemSuccess:
      description: Candidate ingestion resolution response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResolveCandidateIngestionItemSuccessEnvelope' }
    CreateRecommendationSessionSuccess:
      description: Created recommendation session response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateRecommendationSessionSuccessEnvelope' }
    UpdateRecommendationSessionProfileSuccess:
      description: Updated recommendation session response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdateRecommendationSessionProfileSuccessEnvelope' }
    GetRecommendationSessionGuidanceSuccess:
      description: Recommendation guidance response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GetRecommendationSessionGuidanceSuccessEnvelope' }
    GetRecommendationSessionStoreMatchesSuccess:
      description: Recommendation store matches response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GetRecommendationSessionStoreMatchesSuccessEnvelope' }
    SubmitRecommendationSessionFeedbackSuccess:
      description: Recommendation feedback receipt response envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SubmitRecommendationSessionFeedbackSuccessEnvelope' }
  schemas:
    ApiResponse:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean }
        timestamp: { type: string, format: date-time }
        data: {}
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL_ERROR] }
        message: { type: string }
    GetAdminSessionSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/AdminSession' }
        error: { type: 'null' }
    ListCandidateIngestionRunsSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/CandidateRunPage' }
        error: { type: 'null' }
    GetCandidateIngestionRunSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/CandidateRun' }
        error: { type: 'null' }
    ListCandidateIngestionItemsSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/CandidateItemPage' }
        error: { type: 'null' }
    ResolveCandidateIngestionItemSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/CandidateResolution' }
        error: { type: 'null' }
    CreateRecommendationSessionSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/RecommendationSession' }
        error: { type: 'null' }
    UpdateRecommendationSessionProfileSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/RecommendationSession' }
        error: { type: 'null' }
    GetRecommendationSessionGuidanceSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/RecommendationGuidance' }
        error: { type: 'null' }
    GetRecommendationSessionStoreMatchesSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data:
          type: array
          items: { $ref: '#/components/schemas/StoreMatch' }
        error: { type: 'null' }
    SubmitRecommendationSessionFeedbackSuccessEnvelope:
      type: object
      required: [success, timestamp, data, error]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/RecommendationFeedbackReceipt' }
        error: { type: 'null' }
    RecommendationSession:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [CREATED, PROFILE_SAVED, GUIDANCE_READY] }
    RecommendationProfile:
      type: object
      required: [activity, experienceLevel, tripDuration, season, partySize, transport, preferences, constraints]
      properties:
        activity: { type: string, minLength: 1, maxLength: 100 }
        experienceLevel: { type: string, minLength: 1, maxLength: 100 }
        tripDuration: { type: string, minLength: 1, maxLength: 100 }
        season: { type: string, minLength: 1, maxLength: 100 }
        partySize: { type: integer, minimum: 1 }
        transport: { type: string, minLength: 1, maxLength: 100 }
        preferences: { type: array, items: { type: string, minLength: 1, maxLength: 200 }, uniqueItems: true }
        constraints: { type: array, items: { type: string, minLength: 1, maxLength: 200 }, uniqueItems: true }
        additionalContext:
          type: object
          maxProperties: 50
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 500 }
              - { type: number }
              - { type: boolean }
              - { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
    RecommendationGuidance:
      type: object
      required: [ruleVersion, gearGroups, explanations, warnings, unmetConstraints]
      properties:
        ruleVersion: { type: string, minLength: 1, maxLength: 100 }
        gearGroups: { type: array, items: { $ref: '#/components/schemas/GearGroup' } }
        explanations: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        unmetConstraints: { type: array, items: { type: string } }
    GearGroup:
      type: object
      required: [name]
      properties:
        name: { type: string }
        starterKit: { type: boolean }
    StoreMatch:
      type: object
      required: [storeId, gearGroup, sourceType, sourceUrl, verifiedAt, expiresAt, verificationStatus]
      properties:
        storeId: { type: string, format: uuid }
        gearGroup: { $ref: '#/components/schemas/GearGroup' }
        store: { $ref: '#/components/schemas/Store' }
        sourceType: { type: string }
        sourceUrl: { type: string, format: uri }
        verifiedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        verificationStatus: { type: string, enum: [VERIFIED] }
    RecommendationFeedback:
      type: object
      required: [helpful]
      properties:
        helpful: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    RecommendationFeedbackReceipt:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACCEPTED] }
    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    AdminSession:
      type: object
      required: [authenticated, csrfToken]
      properties:
        authenticated: { type: boolean }
        email: { type: [string, 'null'], format: email }
        csrfToken: { type: string }
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [UP] } }
    CategorySlug: { type: string, enum: [HIKING, BACKPACKING, CAMPING, CLIMBING] }
    Category:
      type: object
      required: [slug, displayName]
      properties: { slug: { $ref: '#/components/schemas/CategorySlug' }, displayName: { type: string } }
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    Store:
      type: object
      required: [id, name, address, coordinates, categories, verifiedAt, informationStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        categories: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CategorySlug' } }
        phone: { type: string }
        hours: { type: string }
        description: { type: string }
        verifiedAt: { type: string, format: date-time }
        informationStatus: { $ref: '#/components/schemas/StoreInformationStatus' }
    StoreInformationStatus: { type: string, enum: [VERIFIED, REVIEW_DUE] }
    StoreInput:
      type: object
      required: [name, address, coordinates, categories]
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        categories: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CategorySlug' } }
        phone: { type: string }
        hours: { type: string }
        description: { type: string }
    StoreRejectionInput:
      type: object
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    StorePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Store' } }
        nextCursor: { type: [string, 'null'] }
        search: { $ref: '#/components/schemas/SearchDisclosure' }
    SearchDisclosure:
      type: object
      required: [originalQuery, appliedQuery]
      properties:
        originalQuery: { type: string }
        appliedQuery: { type: string }
        correction: { type: [string, 'null'] }
    FeedbackInput:
      type: object
      required: [kind, content]
      properties:
        kind: { type: string, enum: [CORRECTION, GENERAL, NEW_STORE] }
        storeId: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 2000 }
        replyEmail: { type: string, format: email, description: Optional reply address; requires contactConsent=true. }
        contactConsent: { type: boolean, description: Must be true when replyEmail is provided. }
        categoryRelated: { type: boolean, default: false }
    FeedbackReceipt:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED] }
    FeedbackResolutionInput:
      type: object
      required: [resolutionStatus, resolutionSummary]
      properties:
        resolutionStatus: { type: string, enum: [RESOLVED, REJECTED] }
        resolutionSummary: { type: string, minLength: 1, maxLength: 1000 }
    AdminFeedback:
      type: object
      required: [id, kind, content, contactConsent, submittedAt, resolutionStatus, notificationStatus]
      properties:
        id: { type: string, format: uuid }
        storeId: { type: [string, 'null'], format: uuid }
        storeName: { type: [string, 'null'] }
        kind: { type: string, enum: [CORRECTION, GENERAL, NEW_STORE] }
        content: { type: string }
        contactConsent: { type: boolean }
        submittedAt: { type: string, format: date-time }
        resolutionStatus: { type: string, enum: [PENDING, RESOLVED, REJECTED] }
        resolutionSummary: { type: [string, 'null'] }
        notificationStatus: { type: string, enum: [NOT_REQUESTED, QUEUED, SENT, FAILED] }
    CorrectionRuleInput:
      type: object
      required: [source, targetType, target]
      properties:
        source: { type: string, minLength: 1 }
        targetType: { type: string, enum: [CATEGORY, STORE] }
        target: { type: string, minLength: 1 }
        active: { type: boolean, default: true }
    CorrectionRule:
      type: object
      required: [id, source, targetType, target, active]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        targetType: { type: string, enum: [CATEGORY, STORE] }
        target: { type: string }
        active: { type: boolean }
    AdminStoreGroups:
      type: object
      additionalProperties:
        type: array
        items: { $ref: '#/components/schemas/AdminStore' }
    AdminStore:
      type: object
      required: [id, name, address, coordinates, categories, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        categories: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CategorySlug' } }
        phone: { type: string }
        hours: { type: string }
        description: { type: string }
        status: { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, REJECTED] }
        verifiedAt: { type: [string, 'null'], format: date-time }
        informationStatus:
          type: [string, 'null']
          enum: [VERIFIED, REVIEW_DUE, null]
    CandidateIngestionRunStatus: { type: string, enum: [RUNNING, PARTIAL, FAILED, COMPLETED] }
    CandidateMatchStatus:
      type: string
      enum: [NOT_EVALUATED, NO_MATCH, EXACT_PROVIDER_RECORD, EXACT_NAME_ADDRESS, EXACT_NAME_COORDINATES, AMBIGUOUS, RESOLVED_EXISTING, RESOLVED_DRAFT]
    CandidateItemOutcome:
      type: string
      enum: [DRAFT_CREATED, MATCHED_EXISTING, DUPLICATE_SKIPPED, QUARANTINED, BLOCKED_BY_GATE, REJECTED, ITEM_FAILED, RESOLVED]
    CandidateResolutionInput:
      oneOf:
        - $ref: '#/components/schemas/CandidateLinkExistingInput'
        - $ref: '#/components/schemas/CandidateCreateDraftInput'
    CandidateLinkExistingInput:
      type: object
      required: [resolutionType, storeId]
      properties:
        resolutionType: { type: string, const: LINK_EXISTING }
        storeId: { type: string, format: uuid }
    CandidateCreateDraftInput:
      type: object
      required: [resolutionType, name, address, coordinates, categories]
      properties:
        resolutionType: { type: string, const: CREATE_DRAFT }
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        categories: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CategorySlug' } }
        phone: { type: string }
        hours: { type: string }
        description: { type: string }
    CandidateRun:
      type: object
      required: [id, provider, idempotencyKey, requestedBy, requestedAt, status, gateVersion, seenCount, acceptedCount, dedupedCount, quarantinedCount, rejectedCount, failedCount]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        idempotencyKey: { type: string }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/CandidateIngestionRunStatus' }
        gateVersion: { type: string }
        seenCount: { type: integer }
        acceptedCount: { type: integer }
        dedupedCount: { type: integer }
        quarantinedCount: { type: integer }
        rejectedCount: { type: integer }
        failedCount: { type: integer }
        errorCode: { type: [string, 'null'] }
        errorSummary: { type: [string, 'null'] }
    CandidateItem:
      type: object
      required: [id, firstSeenRunId, lastSeenRunId, provider, sourceUrl, normalizedName, latestOutcome, latestMatchStatus, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        firstSeenRunId: { type: string, format: uuid }
        lastSeenRunId: { type: string, format: uuid }
        provider: { type: string }
        providerRecordId: { type: [string, 'null'] }
        sourceUrl: { type: string }
        normalizedName: { type: string }
        roadAddress: { type: [string, 'null'] }
        roundedLatitude: { type: [number, 'null'] }
        roundedLongitude: { type: [number, 'null'] }
        phone: { type: [string, 'null'] }
        industryCode: { type: [string, 'null'] }
        latestOutcome: { $ref: '#/components/schemas/CandidateItemOutcome' }
        latestMatchStatus: { $ref: '#/components/schemas/CandidateMatchStatus' }
        resolvedStoreId: { type: [string, 'null'], format: uuid }
        resolvedStoreStatus: { type: [string, 'null'], enum: [DRAFT, IN_REVIEW, PUBLISHED, REJECTED, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CandidateRunPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CandidateRun' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    CandidateItemPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CandidateItem' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    CandidateResolution:
      type: object
      required: [itemId, outcome, matchStatus, resolvedStoreId, resolvedStoreStatus]
      properties:
        itemId: { type: string, format: uuid }
        outcome: { type: string, enum: [RESOLVED] }
        matchStatus: { type: string, enum: [RESOLVED_EXISTING, RESOLVED_DRAFT] }
        resolvedStoreId: { type: string, format: uuid }
        resolvedStoreStatus: { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, REJECTED] }
    CategoryHealth:
      type: object
      required: [category, publishedStoreCount, storesByLifecycle, openReviewFlagCount]
      properties:
        category: { $ref: '#/components/schemas/CategorySlug' }
        publishedStoreCount: { type: integer }
        storesByLifecycle: { type: object, additionalProperties: { type: integer } }
        openReviewFlagCount: { type: integer }
    CategoryReviewFlag:
      type: object
      required: [id, storeId, storeName, source, sourceFeedbackId, reason, state, assignee, resolution, createdAt, resolvedAt, resolvedBy]
      properties:
        id: { type: string, format: uuid }
        storeId: { type: [string, 'null'], format: uuid }
        storeName: { type: [string, 'null'] }
        source: { type: string, enum: [FEEDBACK, REJECTION, VALIDATION, MANUAL] }
        sourceFeedbackId: { type: [string, 'null'], format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
        state: { type: string, enum: [OPEN, RESOLVED] }
        assignee: { type: [string, 'null'] }
        resolution: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { type: [string, 'null'] }
    ManualCategoryReviewFlagInput:
      type: object
      required: [storeId, reason]
      properties:
        storeId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CategoryReviewFlagUpdateInput:
      type: object
      properties:
        state: { type: string, enum: [OPEN, RESOLVED] }
        assignee: { type: string, maxLength: 200 }
        resolution: { type: string, maxLength: 1000 }
    AdminDashboard:
      type: object
      required: [stores, feedback, activeCorrectionRules, categoryHealth, openCategoryReviewFlagCount]
      properties:
        stores: { type: object, additionalProperties: { type: integer } }
        feedback: { type: object, additionalProperties: { type: integer } }
        activeCorrectionRules: { type: integer }
        categoryHealth: { type: array, items: { $ref: '#/components/schemas/CategoryHealth' } }
        openCategoryReviewFlagCount: { type: integer }
