services:
  postgres:
    image: postgres:16-alpine
    env_file: ${GEARBY_ENV_FILE:-../.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gearby}
      POSTGRES_USER: ${POSTGRES_USER:-gearby}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
