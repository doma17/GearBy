services:
  postgres:
    image: postgres:16-alpine
    env_file: ${GEARBY_ENV_FILE:-../.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gearby}
      POSTGRES_USER: ${POSTGRES_USER:-gearby}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ${GEARBY_ENV_FILE:-../.env}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gearby}
      DATABASE_USERNAME: ${POSTGRES_USER:-gearby}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        API_BASE_URL: http://localhost:8080
        NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
